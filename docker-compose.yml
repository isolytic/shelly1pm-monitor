services:
  shelly1pm-monitor:
    image: ghcr.io/isolytic/shelly1pm-monitor:latest
    container_name: shelly1pm-monitor
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      SHELLY_URL: ${SHELLY_URL:-http://10.10.80.59}
      PORT: ${PORT:-8787}
      DATA_DIR: ${DATA_DIR:-/app/data}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      ACTIVATION_POWER_THRESHOLD_WATTS: ${ACTIVATION_POWER_THRESHOLD_WATTS:-150}
      SIGNIFICANT_POWER_THRESHOLD_WATTS: ${SIGNIFICANT_POWER_THRESHOLD_WATTS:-150}
      CRITICAL_POWER_THRESHOLD_WATTS: ${CRITICAL_POWER_THRESHOLD_WATTS:-600}
      NOTIFICATION_COOLDOWN_HOURS: ${NOTIFICATION_COOLDOWN_HOURS:-8}
      CRITICAL_NOTIFICATION_COOLDOWN_MINUTES: ${CRITICAL_NOTIFICATION_COOLDOWN_MINUTES:-30}
      QUIET_WINDOW_HOURS: ${QUIET_WINDOW_HOURS:-8}
      RUNS_PER_HOUR_ALERT_THRESHOLD: ${RUNS_PER_HOUR_ALERT_THRESHOLD:-6}
      LONG_RUN_ALERT_MINUTES: ${LONG_RUN_ALERT_MINUTES:-15}
      NO_RUN_ALERT_HOURS: ${NO_RUN_ALERT_HOURS:-24}
      STALE_POLLING_ALERT_MINUTES: ${STALE_POLLING_ALERT_MINUTES:-10}
      DEVICE_UNREACHABLE_ALERT_MINUTES: ${DEVICE_UNREACHABLE_ALERT_MINUTES:-10}
      COST_PER_KWH: ${COST_PER_KWH:-0.15}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8787}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MESSAGE_TEMPLATE: ${DISCORD_MESSAGE_TEMPLATE:-[%severity%] %alert_type% at %timestamp%. %alert_details% Live load: %live_load%. Usage today: %usage_today% (%usage_cost_today%). Status: %current_status%. Web UI: %public_web_url%}
    volumes:
      - shelly1pm-monitor-data:/app/data

volumes:
  shelly1pm-monitor-data:
